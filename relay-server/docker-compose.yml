services:
  relay:
    build: .
    image: mihuan-relay:latest
    container_name: mihuan-relay
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - relay-data:/app/data
    # 首次启动可通过环境变量设置初始管理密码（可选）：
    # environment:
    #   RELAY_ADMIN_PASSWORD: change-me

volumes:
  relay-data:
